<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mohan Lal Mishra – Admin / Vendor Panel</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#f3f5f9;color:#1d2433}
header{background:#0B3D91;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px;letter-spacing:.5px}nav{display:flex;flex-wrap:wrap;gap:4px;padding:8px 20px;background:#fff;border-bottom:1px solid #dde}
nav button{background:none;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;font-size:14px}nav button.on{background:#e6edfa;color:#0B3D91;font-weight:600}
main{padding:20px}table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid #eef;text-align:left;vertical-align:top}th{background:#f7f9fd}
button.b{background:#0B3D91;color:#fff;border:0;padding:6px 10px;border-radius:5px;cursor:pointer;margin:1px;font-size:12px}
button.g{background:#2e7d32}button.r{background:#c62828}button.o{background:#ef6c00}
input,select,textarea{padding:7px;border:1px solid #ccd;border-radius:5px;font-size:13px}
.card{background:#fff;border-radius:8px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.stat{font-size:26px;font-weight:700;color:#0B3D91}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}.pill{padding:2px 8px;border-radius:10px;background:#e6edfa;font-size:11px}
#login{max-width:340px;margin:80px auto}.muted{color:#778;font-size:12px}img.t{width:48px;height:36px;object-fit:cover;border-radius:4px}
</style></head><body>
<header><b>MOHAN LAL MISHRA</b><span id="who"></span></header>
<nav id="nav" hidden></nav><main id="app"></main>
<script src="app.js"></script></body></html>
